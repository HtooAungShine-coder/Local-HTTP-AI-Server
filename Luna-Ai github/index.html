<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supreme Luna AI</title>
    <style>
        body {
            background-color: #0b0f14;
            color: #e2e8f0;
            font-family: monospace;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }
        header {
            width: 100%;
            max-width: 800px;
            padding: 20px;
            box-sizing: border-box;
        }
        h1 {
            color: #f97316;
            margin: 0;
            font-size: 24px;
        }
        .chat-container {
            width: 100%;
            max-width: 800px;
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            overflow: hidden;
        }
        .response-section {
            flex: 1;
            background-color: #111827;
            border: 1px solid #1f2937;
            border-radius: 8px;
            padding: 20px;
            overflow-y: auto;
            margin-bottom: 20px;
        }
        .message {
            padding: 10px 15px;
            margin-bottom: 15px;
            border-radius: 6px;
            max-width: 85%;
            word-wrap: break-word;
        }
        .user-message {
            background-color: #ea580c;
            color: white;
            margin-left: auto;
        }
        .ai-message {
            background-color: #0b0f14;
            border: 1px solid #1f2937;
        }
        .send-section {
            display: flex;
            gap: 10px;
        }
        input {
            flex: 1;
            background-color: #111827;
            border: 1px solid #1f2937;
            color: #e2e8f0;
            padding: 12px;
            border-radius: 6px;
            outline: none;
            font-family: monospace;
        }
        input:focus {
            border-color: #f97316;
        }
        button {
            background-color: #f97316;
            color: #0b0f14;
            border: none;
            border-radius: 6px;
            padding: 0 24px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>supreme_luna_ai.terminal</h1>
    </header>

    <div class="chat-container">
        <div class="response-section" id="responseWindow">
            <div style="color: #4b5563; text-align: center; margin-top: 50px;">System online. Awaiting data input...</div>
        </div>

        <div class="send-section">
            <input type="text" id="userInput" placeholder="Ask Supreme Luna AI anything..." autocomplete="off">
            <button id="sendBtn">Send</button>
        </div>
    </div>

    <script>
        const responseWindow = document.getElementById('responseWindow');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // Clear input box immediately
            userInput.value = '';

            // Render User Bubble
            const userDiv = document.createElement('div');
            userDiv.className = 'message user-message';
            userDiv.textContent = text;
            responseWindow.appendChild(userDiv);
            responseWindow.scrollTop = responseWindow.scrollHeight;

            try {
                const response = await fetch(`${window.location.origin}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `message=${encodeURIComponent(text)}`
                });

                const reply = await response.text();
                
                // Render AI Bubble
                const aiDiv = document.createElement('div');
                aiDiv.className = 'message ai-message';
                aiDiv.textContent = reply || "Received empty signal from backend.";
                responseWindow.appendChild(aiDiv);
            } catch (err) {
                const errDiv = document.createElement('div');
                errDiv.className = 'message ai-message';
                errDiv.style.color = '#f87171';
                errDiv.style.borderColor = '#ef4444';
                errDiv.textContent = "Error connecting to Go server loop.";
                responseWindow.appendChild(errDiv);
            }
            responseWindow.scrollTop = responseWindow.scrollHeight;
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
